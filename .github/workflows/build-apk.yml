name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: android

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Assets (Vite)
        run: npm run build

      - name: Sync Android with Capacitor
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Package
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk TuneSense-latest.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TuneSense-Debug-APK
          path: TuneSense-latest.apk
          if-no-files-found: error

      - name: Publish or Update Latest Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "TuneSense - Latest Android Build"
          body: |
            ## 🎸 TuneSense (1980s Marvel Comic Book Edition)
            Build otomatis terbaru dari branch `main`.

            - **Commit**: `${{ github.sha }}`
            - **Author**: Fathan Nuhi
            - **Update**: ${{ github.event.head_commit.message }}

            ### 📲 Download & Install
            Klik file **`TuneSense-latest.apk`** di bawah untuk langsung mengunduh dan memasang di smartphone Android Anda.
          files: TuneSense-latest.apk
          make_latest: true
